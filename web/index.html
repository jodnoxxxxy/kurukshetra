<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kurukshetra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>kurukshetra</title>
  <link rel="manifest" href="manifest.json">

  <!-- Firebase messaging service worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js', {scope: '/firebase-cloud-messaging-push-scope'})
          .then(function (registration) {
            console.log('Firebase messaging service worker registered successfully', registration);
          })
          .catch(function (error) {
            console.log('Firebase messaging service worker registration failed: ', error);
          });
      });
    }
  </script>

  <!-- Suppress non-critical DevTools console warnings on web -->
  <script>
    const originalWarn = console.warn;
    const originalError = console.error;
    
    console.warn = function(...args) {
      const message = args.join(' ');
      // Suppress DevTools extension warnings (non-critical on web)
      if (message.includes('ext.flutter.activeDevToolsServerAddress') || 
          message.includes('ext.flutter.connectedVmServiceUri') ||
          message.includes('Unknown method')) {
        return;
      }
      originalWarn.apply(console, args);
    };

    console.error = function(...args) {
      const message = args.join(' ');
      // Suppress DevTools extension errors (non-critical on web)
      if (message.includes('ext.flutter.activeDevToolsServerAddress') || 
          message.includes('ext.flutter.connectedVmServiceUri') ||
          message.includes('Unknown method')) {
        return;
      }
      originalError.apply(console, args);
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
