version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kurukshetra-db
    environment:
      POSTGRES_DB: kurukshetra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - kurukshetra-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kurukshetra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kurukshetra-network

  # Backend API
  backend:
    build: .
    container_name: kurukshetra-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kurukshetra
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - kurukshetra-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  kurukshetra-network:
    driver: bridge
